[project]
name = "mistake-notes"
version = "0.1.0"
description = "Student mistake review and personal notes application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi>=23.1.0",
  "fastapi>=0.115.0,<1.0.0",
  "itsdangerous>=2.2.0",
  "jsonschema>=4.23.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.20,<1.0.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

