services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mistake_notes}
      POSTGRES_USER: ${POSTGRES_USER:-mistake_notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mistake_notes} -d ${POSTGRES_DB:-mistake_notes}",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-secret}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mistake_notes}:${POSTGRES_PASSWORD:-change-me-for-local-development}@db:5432/${POSTGRES_DB:-mistake_notes}
      DATASET_PATH: /app/data/wrong-answers-20/dataset.json
      SCHEMA_PATH: /app/data/wrong-answers-20/schema.json
      FRONTEND_DIST: /app/frontend_dist
      NOTE_IMAGE_DIR: /app/note_images
    volumes:
      - note_images:/app/note_images
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
    name: mistake_notes_postgres_data
  note_images:
    name: mistake_notes_note_images

